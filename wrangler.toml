name               = "peakmemory"
main               = "worker.js"
compatibility_date = "2026-07-19"

[assets]
directory          = "./dist"
binding            = "ASSETS"
run_worker_first   = true
not_found_handling = "none"

[[ratelimits]]
name = "TERRAIN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
